# Put this file at  .streamlit/config.toml  in your repository (create the .streamlit folder if needed).
# Native dark theme that matches the Arka terminal palette, so widgets never flash white while CSS loads.

[theme]
base = "dark"
primaryColor = "#FF9F0A"
backgroundColor = "#050505"
secondaryBackgroundColor = "#0F0F0F"
textColor = "#ECECEC"
font = "sans serif"

[client]
toolbarMode = "minimal"

[runner]
fastReruns = true

[server]
maxUploadSize = 20
