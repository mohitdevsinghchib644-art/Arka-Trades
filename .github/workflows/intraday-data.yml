# Arka Trades · Intraday data
# Collects five-minute candles for every F&O stock, NIFTY and BANK NIFTY from Angel One and keeps them on the
# "intraday-data" branch, one file a month (m5/YYYY-MM.csv.gz). This is the history intraday rules are tested on.
#
# It only logs in and reads candles. It cannot place, change or cancel an order: the script refuses any other address.
#
# Needs four repository secrets (Settings -> Secrets and variables -> Actions -> New repository secret), with the same
# names and values as in Cloudflare:  ANGEL_API_KEY  ANGEL_CLIENT_CODE  ANGEL_PIN  ANGEL_TOTP_SECRET
#
# First time: Actions tab -> "Intraday data" -> "Run workflow" -> Run. Two years of history take three to five hours.
# Angel One sometimes answers "Too many requests": the job then waits and tries again. Whatever it has collected is always
# saved, and the next run (by hand, or the daily one) continues from there, so nothing is fetched twice.
# After that it runs by itself at about 4:10 pm IST, Monday to Friday, and adds the day in a few minutes.
name: Intraday data

on:
  schedule:
    - cron: "40 10 * * 1-5"       # 16:10 IST, after the close
  workflow_dispatch:
    inputs:
      days:
        description: "Days of history to keep (730 = two years). Stored days are skipped."
        default: "730"

permissions:
  contents: write

concurrency:
  group: intraday-data
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Last published files
        run: |
          echo "OUT=$RUNNER_TEMP/intraday" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/intraday"
          if git fetch --quiet --depth 1 origin intraday-data; then git archive FETCH_HEAD | tar -x -C "$RUNNER_TEMP/intraday"; fi
          ls "$RUNNER_TEMP/intraday/m5" 2>/dev/null | tail -40 || true      # nothing is there on the very first run

      - name: Collect candles
        env:
          ANGEL_API_KEY: ${{ secrets.ANGEL_API_KEY }}
          ANGEL_CLIENT_CODE: ${{ secrets.ANGEL_CLIENT_CODE }}
          ANGEL_PIN: ${{ secrets.ANGEL_PIN }}
          ANGEL_TOTP_SECRET: ${{ secrets.ANGEL_TOTP_SECRET }}
          DAYS: ${{ github.event.inputs.days || '730' }}
        run: python intraday_data.py --out "$OUT" --days "${DAYS//[^0-9]/}" --minutes 300

      - name: Intraday lab (tests the ideas on the candles)
        if: always()
        continue-on-error: true
        run: |
          ls "$OUT"/m5/*.csv.gz >/dev/null 2>&1 || { echo "No candles yet."; exit 0; }
          pip install --quiet "pandas>=2,<4" "numpy>=1.26"
          python intraday_lab.py --data "$OUT" --picks arka_data/model/day_picks.csv --out "$OUT/lab.json"

      - name: Publish on the intraday-data branch
        if: always()
        run: |
          cd "$OUT"
          ls m5/*.csv.gz >/dev/null 2>&1 || { echo "Nothing to publish."; exit 0; }
          rm -rf .git
          git init --quiet -b intraday-data
          git config user.name "arka-data-bot"
          git config user.email "arka-data-bot@users.noreply.github.com"
          git add -A
          git commit --quiet -m "Intraday data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --quiet --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" intraday-data
          cat m5/index.json
