name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 5 minutes from 3:30 AM UTC to 10:30 AM UTC (9:00 AM to 4:00 PM IST), Monday to Friday
    - cron: '30,35,40,45,50,55 3 * * 1-5'
    - cron: '*/5 4-9 * * 1-5'
    - cron: '0,5,10,15,20,25,30 10 * * 1-5'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit App
        run: |
          APP_URL="https://arka-trades-1.streamlit.app"
          
          echo "Pinging $APP_URL to keep active..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$APP_URL")
          echo "HTTP Status Code: $STATUS"
