# Arka Trades · Results dates
# Reads from Yahoo Finance when each F&O company published its quarterly results (and the surprise against what analysts
# expected, where Yahoo has it) and keeps the list in arka_data/results/dates.csv. The model needs this history before it
# can test anything around results. Public data only: no login and no secret.
# (BSE's own list was tried first; BSE refuses calls from GitHub's servers.)
#
# First time: Actions tab -> "Results dates" -> "Run workflow". About 10 minutes.
# After that it runs by itself every Saturday and adds the new ones.
name: Results dates

on:
  schedule:
    - cron: "30 3 * * 6"          # Saturday 9:00 am IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: results-dates
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install --quiet yfinance "pandas>=2,<4" lxml html5lib beautifulsoup4 || echo "yfinance could not be installed; Yahoo is asked directly instead"

      - name: Read the results dates
        run: python results_dates.py

      - name: Save to the repository
        run: |
          git config user.name "arka-data-bot"
          git config user.email "arka-data-bot@users.noreply.github.com"
          git add arka_data/results || true
          if git diff --cached --quiet; then
            echo "Nothing new to save."
            exit 0
          fi
          git commit -m "Results dates $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin "$GITHUB_REF_NAME" || true
          git push
